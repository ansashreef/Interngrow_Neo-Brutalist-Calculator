<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div class="calculator">
         <h2 class="title">Neo Calculator</h2>
      <div class="top-bar">

    <div class="mode">
        <button id="standardBtn">Standard</button>
        <button id="programmerBtn">Programmer</button>
    </div>

    <button id="themeBtn">🌙</button>

</div>

    <input type="text" id="display" readonly>
    <div id="programmerPanel" style="display: none;">

    <p>Decimal : <span id="decValue">0</span></p>

    <p>Binary : <span id="binValue">0</span></p>

    <p>Hex : <span id="hexValue">0</span></p>

</div>

<div class="buttons">

    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="backspace()">⌫</button>
<button class="operator" onclick="percentage()">%</button>
    <button class="operator" onclick="addValue('/')">/</button>

    <button onclick="addValue('7')">7</button>
    <button onclick="addValue('8')">8</button>
    <button onclick="addValue('9')">9</button>
    <button class="operator" onclick="addValue('*')">*</button>

    <button onclick="addValue('4')">4</button>
    <button onclick="addValue('5')">5</button>
    <button onclick="addValue('6')">6</button>
    <button class="operator" onclick="addValue('-')">-</button>

    <button onclick="addValue('1')">1</button>
    <button onclick="addValue('2')">2</button>
    <button onclick="addValue('3')">3</button>
    <button class="operator" onclick="addValue('+')">+</button>

    <button onclick="addValue('0')">0</button>
    <button onclick="addValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>

</div>
    

</div>

    <script src="script.js"></script>

</body>
</html>
